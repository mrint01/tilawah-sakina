name: Remake waiting reels

# Renders waiting reels again in the current design (same id, status and posting time) and replaces their files.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Reel ids, space separated (e.g. 20261125-110145-asma)"
        required: true

permissions:
  contents: write

concurrency:
  group: queue-state
  cancel-in-progress: false

jobs:
  remake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Arabic text shaping
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0 libfribidi0 libharfbuzz0b
          pip install -q pillow numpy
      - name: Remake
        env:
          IDS: ${{ inputs.ids }}
        run: python3 -u pipeline.py remake $IDS
      - name: Save
        if: always()
        run: |
          git config user.name "tilawah-sakina-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/queue.json
          git diff --cached --quiet && exit 0
          git commit -m "Remade ${{ inputs.ids }} in the current design"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
