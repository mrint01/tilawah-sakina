name: Post next reel

on:
  schedule:
    # Every hour at 7 past: posts the slot that is due (pipeline.py SLOTS, Tunisia time) if it is not posted yet.
    # GitHub sometimes skips scheduled runs for hours; the next run catches up (up to 3 hours late, a slot posts once).
    # The panel (Vercel cron, api/tick.js) also starts this at every slot, as a second trigger.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "Publish this reel now (from the panel's Publish now); empty = the slot's next reel"
        default: ""
      kind:
        description: "What to post (auto = the kind of the nearest slot; due = the slot due now, if not posted yet)"
        type: choice
        options: [auto, due, ayah, dua, asma, tasbih, quiz]
        default: auto
      dry_run:
        description: "Only publish the video link, don't post to Instagram"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: queue-state
  cancel-in-progress: false

jobs:
  # Cheap hourly check: records missed slots and says whether a slot is due (no Pages deployment when nothing is).
  check:
    if: github.event_name == 'schedule' || inputs.kind == 'due'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.due.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Is a slot due?
        id: due
        run: |
          id=$(python3 pipeline.py next --due --dry)
          echo "go=$([ -n "$id" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          git config user.name "tilawah-sakina-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/queue.json
          git diff --cached --quiet && exit 0
          git commit -qm "Slots: record missed posts"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done

  post:
    needs: check
    if: ${{ !cancelled() && (needs.check.outputs.go == 'true' || (github.event_name == 'workflow_dispatch' && inputs.kind != 'due')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pick the next approved reel
        id: pick
        env:
          CRON: ${{ github.event.schedule }}
          KIND: ${{ inputs.kind }}
          ID: ${{ inputs.id }}
        run: |
          if [ -n "$ID" ]; then
            id=$(python3 pipeline.py check "$ID")
            echo "id=$id" >> "$GITHUB_OUTPUT"
            if [ -z "$id" ]; then python3 pipeline.py posting failed --id "$ID" --error "This reel is no longer approved"; exit 1; fi
            python3 pipeline.py posting preparing --id "$id"
            exit 0
          fi
          if [ -n "$CRON" ] || [ "$KIND" = "due" ]; then args="--due"
          elif [ -n "$KIND" ] && [ "$KIND" != "auto" ]; then args="--kind $KIND"; else args=""; fi
          id=$(python3 pipeline.py next $args)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          if [ -z "$id" ]; then echo "::warning::Nothing to post now ($args)."; else python3 pipeline.py posting preparing --id "$id"; fi

      - name: Download the video
        if: steps.pick.outputs.id != ''
        run: |
          mkdir -p site/v
          gh release download queue -p "${{ steps.pick.outputs.id }}.mp4" -D site/v
          gh release download queue -p "${{ steps.pick.outputs.id }}-cover.jpg" -D site/v || echo "no cover: Instagram uses the first frame"
          python3 pipeline.py posting video
          echo '<!doctype html><title>Tilawah Sakina</title><p>Reel hosting for @tilawah.sakina</p>' > site/index.html

      - name: Convert to Instagram's standard format
        if: steps.pick.outputs.id != ''
        run: |
          # Instagram processes full-range (yuvj420p) video but then fails to publish it: re-encode to
          # standard yuv420p (tv range, BT.709), AAC 48 kHz, moov atom first.
          f=site/v/${{ steps.pick.outputs.id }}.mp4
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          ffmpeg -y -loglevel error -i "$f" -vf "scale=in_range=full:out_range=tv,format=yuv420p" \
            -c:v libx264 -preset medium -crf 20 -profile:v high -level 4.1 -r 30 \
            -color_range tv -colorspace bt709 -color_primaries bt709 -color_trc bt709 \
            -c:a aac -b:a 160k -ar 48000 -ac 2 -movflags +faststart /tmp/n.mp4
          mv /tmp/n.mp4 "$f"
          ffprobe -v error -show_entries stream=codec_name,pix_fmt,width,height,sample_rate -of compact "$f"

      - name: Host it on GitHub Pages
        if: steps.pick.outputs.id != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Let the artifact settle
        if: steps.pick.outputs.id != ''
        run: sleep 20

      - name: Deploy Pages
        if: steps.pick.outputs.id != ''
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Check the link works
        if: steps.pick.outputs.id != ''
        run: |
          url="${{ steps.deploy.outputs.page_url }}v/${{ steps.pick.outputs.id }}.mp4"
          echo "VIDEO_URL=$url" >> "$GITHUB_ENV"
          if [ -f "site/v/${{ steps.pick.outputs.id }}-cover.jpg" ]; then
            echo "COVER_URL=${{ steps.deploy.outputs.page_url }}v/${{ steps.pick.outputs.id }}-cover.jpg" >> "$GITHUB_ENV"
          fi
          python3 pipeline.py posting hosting
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code} %{content_type}" "$url")
            echo "$code"; case "$code" in 200*) exit 0;; esac; sleep 10
          done
          exit 1

      - name: Post to Instagram
        if: steps.pick.outputs.id != '' && !inputs.dry_run
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 pipeline.py post "${{ steps.pick.outputs.id }}" --url "$VIDEO_URL" ${COVER_URL:+--cover-url "$COVER_URL"}

      - name: Tell the panel it failed
        if: failure() && steps.pick.outputs.id != ''
        run: |
          python3 - <<'EOF'
          import json, pipeline
          d = json.loads(pipeline.POSTING.read_text()) if pipeline.POSTING.exists() else {}
          if not d.get("finished"):
              pipeline.posting("failed", error="Posting failed: see the run on GitHub")
              d = json.loads(pipeline.POSTING.read_text())
          q = pipeline.queue()
          pipeline.slot_result(q, "${{ steps.pick.outputs.id }}", False, d.get("error") or "Posting failed")
          pipeline.save(pipeline.QUEUE, q)
          EOF

      - name: Save state and remove the posted video
        if: always() && steps.pick.outputs.id != '' && !inputs.dry_run
        run: |
          # Free the release: full videos of posted and rejected reels are no longer needed.
          # Reels marked posted by hand keep theirs 3 days (so "Not posted (undo)" still works).
          # The small preview + contact sheet stay for the panel's history.
          python3 - > /tmp/done.txt <<'EOF'
          import json
          from datetime import datetime, timedelta, timezone
          q = json.load(open("state/queue.json"))
          old = (datetime.now(timezone.utc) - timedelta(days=3)).isoformat()
          for i in q["items"]:
              if i["status"] == "rejected" or (i["status"] == "posted" and (not i.get("manual") or i.get("posted", "") < old)):
                  print(i["id"])
          EOF
          have=$(gh release view queue --json assets -q '.assets[].name')
          for id in $(cat /tmp/done.txt); do
            if echo "$have" | grep -qx "$id.mp4"; then gh release delete-asset queue "$id.mp4" -y || true; fi
            if echo "$have" | grep -qx "$id-cover.jpg"; then gh release delete-asset queue "$id-cover.jpg" -y || true; fi
          done
          git config user.name "tilawah-sakina-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/queue.json
          git diff --cached --quiet && exit 0
          git commit -m "Posted ${{ steps.pick.outputs.id }}"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
