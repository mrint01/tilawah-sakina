name: Panel stats check

# Read-only: runs the panel's own /api/instagram code with the real token and prints, for every post on the
# account, the numbers Instagram reports next to the reel the panel pairs it with.
on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PANEL_PASSWORD: ci-check-only
        working-directory: panel
        run: |
          cat > /tmp/check.mjs <<'JS'
          import { sessionCookie } from './api/_lib.js';
          import handler from './api/instagram.js';
          const cookie = sessionCookie().split(';')[0];
          const req = { headers: { cookie }, method: 'GET', url: '/api/instagram' };
          let body = '';
          const res = { statusCode: 200, setHeader() {}, end(b) { body = b; } };
          await handler(req, res);
          const d = JSON.parse(body);
          if (d.error) { console.log('ERROR', d.error); process.exit(1); }
          console.log('insights_error:', d.insights_error ?? 'none');
          console.log('totals:', JSON.stringify(d.totals));
          console.log('post        | posted           | views | likes | comm | saves | shares | reach | watch | panel reel');
          const q = JSON.parse((await import('node:fs')).readFileSync('../state/queue.json', 'utf8'));
          const title = Object.fromEntries(q.items.map((i) => [i.id, i.title]));
          for (const p of d.posts) {
            const code = /\/(?:reel|p)\/([^/]+)/.exec(p.permalink)[1];
            console.log([code.padEnd(11), p.timestamp.slice(0, 16), String(p.views).padStart(5), String(p.likes).padStart(5),
              String(p.comments).padStart(4), String(p.saves).padStart(5), String(p.shares).padStart(6), String(p.reach).padStart(5),
              String(p.watch).padStart(5), p.reel ? title[p.reel] : '-'].join(' | '));
          }
          JS
          cp /tmp/check.mjs ./check.mjs && node check.mjs
