name: Instagram photo test

# One-off test: posts test/photo.jpg as a single picture (fast, no video processing).
on: workflow_dispatch

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, time, pipeline as p
          u = os.environ["IG_USER_ID"]
          print("host", p.GRAPH)
          print("me", json.dumps(p.ig("GET", "me", fatal=False, fields="id,name")))
          url = "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/test/photo.jpg"
          c = p.ig("POST", f"{u}/media", image_url=url,
                   caption="If you are grateful, I will surely increase you. (Ibrahim 14:7) 🤍\n\n#quran #islam #alhamdulillah")
          print("container", c["id"])
          for _ in range(12):
              st = p.ig("GET", c["id"], fields="status_code,status")
              print("status", st)
              if st.get("status_code") == "FINISHED": break
              time.sleep(5)
          pub = p.ig("POST", f"{u}/media_publish", creation_id=c["id"])
          print("posted", json.dumps(p.ig("GET", pub["id"], fields="permalink")))
          PY
