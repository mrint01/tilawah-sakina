name: Story example

# Renders one "Stories of the Prophets" reel as a downloadable artifact (nothing is queued or posted).
on:
  workflow_dispatch:
    inputs:
      prophet:
        description: "Prophet key (see make_story.py STORIES / NARRATED)"
        default: "nuh"
      part:
        description: "Part (narrated stories)"
        default: "1"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (nature clips and long backgrounds are big)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1
      - name: Install ffmpeg and Arabic text shaping
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0 libfribidi0 libharfbuzz0b
          pip install -q pillow numpy edge-tts
      - name: Watch memory and disk (in the log every 15 s)
        run: (while true; do echo "MON $(date +%H:%M:%S) $(free -m | awk 'NR==2{print "mem used " $3 " MB, avail " $7 " MB"}') disk $(df -h / | awk 'NR==2{print $4}') free"; sleep 15; done) &
      - name: Render
        run: |
          python3 make_story.py "${{ inputs.prophet }}" --part "${{ inputs.part }}"
          f=$(ls -t reels/story_*.mp4 | head -1); echo "$f"
          python3 -c "import pipeline, sys; from pathlib import Path; p = Path(sys.argv[1]); pipeline.contact_sheet(p, p.with_suffix('.png'), n=8)" "$f"
      - uses: actions/upload-artifact@v4
        with:
          name: story-${{ inputs.prophet }}
          path: |
            reels/story_*.mp4
            reels/story_*.png
