name: Story example

# Renders one "Stories of the Prophets" part as a downloadable artifact. With "queue": also puts it in the queue
# (Needs review in the panel) and keeps the video for good in the 'stories' release. Nothing is posted here.
on:
  workflow_dispatch:
    inputs:
      prophet:
        description: "Prophet key (see make_story.py STORIES / NARRATED)"
        default: "nuh"
      part:
        description: "Part (narrated stories)"
        default: "1"
      queue:
        description: "Add it to the queue (Needs review) and keep it in the 'stories' release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) machines kept shutting down mid-render
    timeout-minutes: 90
    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (nature clips and long backgrounds are big)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1
      - name: Install ffmpeg and Arabic text shaping
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0 libfribidi0 libharfbuzz0b
          pip install -q pillow numpy edge-tts
      - name: Watch memory and disk (in the log every 15 s)
        run: (while true; do echo "MON $(date +%H:%M:%S) $(free -m | awk 'NR==2{print "mem used " $3 " MB, avail " $7 " MB"}') disk $(df -h / | awk 'NR==2{print $4}') free"; sleep 15; done) &
      - name: Render
        timeout-minutes: 30
        run: |
          python3 -u make_story.py "${{ inputs.prophet }}" --part "${{ inputs.part }}"
          f=$(ls -t reels/story_*.mp4 | head -1); echo "$f"
          python3 -c "import pipeline, sys; from pathlib import Path; p = Path(sys.argv[1]); pipeline.contact_sheet(p, p.with_suffix('.png'), n=8)" "$f"
      - uses: actions/upload-artifact@v4
        with:
          name: story-${{ inputs.prophet }}
          path: |
            reels/story_*.mp4
            reels/story_*.png
      - name: Add to the queue
        if: inputs.queue
        run: |
          f=reels/story_${{ inputs.prophet }}_${{ inputs.part }}.mp4
          python3 pipeline.py addstory "${{ inputs.prophet }}" "${{ inputs.part }}" --file "$f"
          git config user.name "tilawah-sakina-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main may have moved meanwhile: take the latest queue and append only the new story
          cp state/queue.json /tmp/mine.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 - <<'EOF'
          import json
          mine = json.load(open("/tmp/mine.json"))
          cur = json.load(open("state/queue.json"))
          have = {it["id"] for it in cur["items"]}
          cur["items"] += [it for it in mine["items"] if it["id"] not in have]
          open("state/queue.json", "w").write(json.dumps(cur, indent=2, ensure_ascii=False) + "\n")
          EOF
            git add state/queue.json
            git diff --cached --quiet && exit 0
            git commit -qm "Story ${{ inputs.prophet }} part ${{ inputs.part }} added (needs review)"
            git push && exit 0
            sleep 5
          done
          exit 1
