name: Generate reels

on:
  schedule:
    # 02:00 UTC = 03:00 Tunisia: tops up every kind to 3 days ready (skips when automation is OFF).
    # Claude reviews the new reels at 04:30, before the first post of the day at 06:00 (and again at 13:30, in case this run started late).
    # The panel's Vercel cron (api/tick.js) also starts it in the same hour, in case GitHub skips this run.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      ayah:
        description: "Ayah reels to make"
        default: "1"
      tasbih:
        description: "Tasbih reels to make"
        default: "1"
      dua:
        description: "Dua reels to make"
        default: "0"
      asma:
        description: "Asma al-Husna reels to make"
        default: "0"
      quiz:
        description: "Quiz reels to make"
        default: "0"
      auto:
        description: "Top up every type to the days-ready setting (the daily run; makes nothing when stocked)"
        type: boolean
        default: false
      spec:
        description: "From the panel: JSON list of reels to make (surah, reciter, tasbih kind). Overrides the counts."
        default: ""

permissions:
  contents: write

concurrency:
  group: queue-state
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (nature clips and long backgrounds are big)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1
      - name: Install ffmpeg and Arabic text shaping
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0 libfribidi0 libharfbuzz0b
          pip install -q pillow numpy
          python3 -c "from PIL import features; assert features.check('raqm'), 'no raqm'; print('raqm ok')"

      - name: Render, check and upload
        env:
          SPEC: ${{ inputs.spec }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.auto }}" = "true" ]; then
            python3 pipeline.py generate --auto
          elif [ -n "$SPEC" ]; then
            python3 pipeline.py generate --spec "$SPEC"
          else
            python3 pipeline.py generate --ayah "${{ inputs.ayah }}" --tasbih "${{ inputs.tasbih }}" --dua "${{ inputs.dua }}" --asma "${{ inputs.asma }}" --quiz "${{ inputs.quiz }}"
          fi

      - name: Save the queue
        run: |
          git config user.name "tilawah-sakina-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main may have moved while rendering (panel approvals, other runs): take the latest queue
          # and append only our new reels, instead of a text merge that can conflict.
          cp state/queue.json /tmp/mine.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 - <<'EOF'
          import json
          mine = json.load(open("/tmp/mine.json"))
          cur = json.load(open("state/queue.json"))
          have = {it["id"] for it in cur["items"]}
          cur["items"] += [it for it in mine["items"] if it["id"] not in have]
          if mine.get("last_auto"):  # the day the daily refill ran (it runs once a day)
              cur["last_auto"] = max(mine["last_auto"], cur.get("last_auto", ""))
          open("state/queue.json", "w").write(json.dumps(cur, indent=2, ensure_ascii=False) + "\n")
          EOF
            git add state/queue.json
            git diff --cached --quiet && exit 0
            git commit -qm "Generated reels (pending review)"
            git push && exit 0
            sleep 5
          done
          exit 1
