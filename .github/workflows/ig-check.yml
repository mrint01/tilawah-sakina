name: Instagram check

# Read-only: shows the connected account, the last posts and today's publishing quota.
on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, pipeline as p
          u = os.environ["IG_USER_ID"]
          print("host", p.GRAPH)
          print(json.dumps(p.ig("GET", u, fields="username,followers_count,media_count")))
          for m in p.ig("GET", f"{u}/media", fields="timestamp,media_product_type,permalink", limit=5)["data"]:
              print(m["timestamp"], m.get("media_product_type"), m.get("permalink"))
          print(json.dumps(p.ig("GET", f"{u}/content_publishing_limit", fields="quota_usage,config")))
          rows = p.ig("GET", f"{u}/media", fields="id,permalink,timestamp,media_product_type,like_count,comments_count,caption", limit=50)["data"]
          print("permalink | type | views likes comments saved shares reach total_interactions")
          for m in rows:
              try:
                  ins = p.ig("GET", f"{m['id']}/insights", fatal=False, metric="views,reach,saved,shares,total_interactions")["data"]
                  v = {x["name"]: x["values"][0]["value"] for x in ins}
              except Exception as e:
                  v = {"error": str(e)[:120]}
              print(m["permalink"], m["timestamp"][:16], m.get("media_product_type"), "views", v.get("views"), "likes", m.get("like_count"),
                    "comments", m.get("comments_count"), "saved", v.get("saved"), "shares", v.get("shares"), "reach", v.get("reach"),
                    "total", v.get("total_interactions"), v.get("error", ""))
              print("CAPTION", m["permalink"], json.dumps((m.get("caption") or "")[:200]))
          for path, f in (("me", "id,name"), ("me/permissions", None)):
              try:
                  print(path, json.dumps(p.ig("GET", path, fatal=False, **({"fields": f} if f else {}))))
              except Exception as e:
                  print(path, e)
          PY
