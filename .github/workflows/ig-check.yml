name: Instagram check

# Read-only: shows the connected account, the last posts and today's publishing quota.
on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, pipeline as p
          u = os.environ["IG_USER_ID"]
          print("host", p.GRAPH)
          print(json.dumps(p.ig("GET", u, fields="username,followers_count,media_count")))
          for m in p.ig("GET", f"{u}/media", fields="timestamp,media_product_type,permalink", limit=5)["data"]:
              print(m["timestamp"], m.get("media_product_type"), m.get("permalink"))
          print(json.dumps(p.ig("GET", f"{u}/content_publishing_limit", fields="quota_usage,config")))
          rows = p.ig("GET", f"{u}/media", fields="id,permalink,timestamp,media_product_type,caption,thumbnail_url,media_url", limit=50)["data"]
          for m in rows:
              print("POSTJSON " + json.dumps({k: m.get(k) for k in ("id", "permalink", "timestamp", "media_product_type", "caption", "thumbnail_url", "media_url")}, ensure_ascii=False))
          import time
          now = int(time.time()); since = now - 29 * 86400
          for params in (dict(metric="follower_count", period="day", since=since, until=now),
                         dict(metric="reach", period="day", since=since, until=now),
                         dict(metric="views", period="day", metric_type="total_value", since=now - 86400, until=now),
                         dict(metric="views,likes,comments,shares,saves,total_interactions,accounts_engaged,follows_and_unfollows", period="day", metric_type="total_value", since=now - 7 * 86400, until=now),
                         dict(metric="online_followers", period="lifetime"),
                         dict(metric="follower_demographics", period="lifetime", metric_type="total_value", breakdown="country"),
                         dict(metric="reach", period="day", metric_type="time_series", since=now - 89 * 86400, until=now - 60 * 86400)):
              try:
                  print("INSIGHTS", json.dumps(params), json.dumps(p.ig("GET", f"{u}/insights", fatal=False, **params))[:1500])
              except Exception as e:
                  print("INSIGHTS", json.dumps(params), "ERR", str(e)[:400])
          for path, f in (("me", "id,name"), ("me/permissions", None)):
              try:
                  print(path, json.dumps(p.ig("GET", path, fatal=False, **({"fields": f} if f else {}))))
              except Exception as e:
                  print(path, e)
          PY
