name: Instagram check

# Read-only: shows the connected account, the last posts and today's publishing quota.
on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, pipeline as p
          u = os.environ["IG_USER_ID"]
          print("host", p.GRAPH)
          print(json.dumps(p.ig("GET", u, fields="username,followers_count,media_count")))
          for m in p.ig("GET", f"{u}/media", fields="timestamp,media_product_type,permalink", limit=5)["data"]:
              print(m["timestamp"], m.get("media_product_type"), m.get("permalink"))
          print(json.dumps(p.ig("GET", f"{u}/content_publishing_limit", fields="quota_usage,config")))
          mid = "18072069047188497"
          rows = p.ig("GET", f"{u}/media", fields="id,permalink", limit=50)["data"]
          mid = next(m["id"] for m in rows if "DgAt40ahEth" in m["permalink"])
          try:
              p.ig("GET", f"{mid}/insights", fatal=False, metric="nonsense")
          except Exception as e:
              print("ALLOWED", str(e)[:1500])
          for met in ["views", "reach", "likes", "comments", "saved", "shares", "total_interactions", "reposts", "replies",
                      "follows", "profile_visits", "profile_activity", "navigation", "ig_reels_video_view_total_time",
                      "ig_reels_avg_watch_time", "viewers", "total_viewers", "total_views", "total_likes", "reels_skip_rate", "link_clicks"]:
              try:
                  r = p.ig("GET", f"{mid}/insights", fatal=False, metric=met)["data"]
                  print("METRIC", met, json.dumps([(x["name"], x["values"][0]["value"] if x.get("values") else x.get("total_value")) for x in r])[:300])
              except Exception as e:
                  print("METRIC", met, "ERR", str(e)[:160])
          try:
              r = p.ig("GET", f"{mid}/insights", fatal=False, metric="profile_activity", breakdown="action_type")
              print("BREAK", json.dumps(r)[:600])
          except Exception as e:
              print("BREAK ERR", str(e)[:200])
          for path, f in (("me", "id,name"), ("me/permissions", None)):
              try:
                  print(path, json.dumps(p.ig("GET", path, fatal=False, **({"fields": f} if f else {}))))
              except Exception as e:
                  print(path, e)
          PY
